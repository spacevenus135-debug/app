name: Boosteroid APK Extract

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JADX (fixed version)
        run: |
          JADX_VERSION="1.4.7"
          echo "📦 Downloading JADX v${JADX_VERSION}..."
          curl -L "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip" \
            -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          echo "$PWD/jadx/bin" >> $GITHUB_PATH
          echo "✅ JADX installed successfully"

      - name: List APK files in repo
        run: |
          echo "📁 Looking for APK files..."
          find . -name "*.apk" -type f
          echo ""
          echo "📁 All files in root:"
          ls -la

      - name: Decompile APK from repo
        run: |
          # ابحث عن أي ملف APK في المستودع
          APK_FILE=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK file found in repository!"
            echo "📁 Please upload an APK file to the repository root."
            exit 1
          fi
          echo "📱 Found APK: $APK_FILE"
          echo "📏 Size: $(du -h "$APK_FILE" | cut -f1)"
          
          echo "🔧 Decompiling APK..."
          jadx/bin/jadx --threads-count 4 --output-dir decompiled "$APK_FILE"
          echo "✅ Decompiled $(find decompiled -name '*.java' | wc -l) Java files"

      - name: Extract Client ID & Secret
        run: |
          python3 << 'PYEOF'
          import os, re, json
          from pathlib import Path

          ROOT = Path("decompiled")
          OUT  = Path("credentials.txt")
          JSON = Path("credentials.json")

          PATTERNS = {
              "client_id": [
                  r'client[_-]?id["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-\.]{6,})',
                  r'clientId["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-\.]{6,})',
                  r'CLIENT_ID["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-\.]{6,})',
                  r'app[_-]?id["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-\.]{6,})',
              ],
              "client_secret": [
                  r'client[_-]?secret["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9+/=_\-]{8,})',
                  r'clientSecret["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9+/=_\-]{8,})',
                  r'CLIENT_SECRET["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9+/=_\-]{8,})',
                  r'app[_-]?secret["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9+/=_\-]{8,})',
              ],
              "api_key": [
                  r'api[_-]?key["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-]{10,})',
                  r'API_KEY["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-]{10,})',
                  r'apiKey["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-]{10,})',
              ],
              "oauth_token": [
                  r'Bearer\s+([A-Za-z0-9\._\-]{20,})',
                  r'access[_-]?token["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9\._\-]{20,})',
                  r'oauth[_-]?token["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9\._\-]{20,})',
              ],
              "base_url": [
                  r'(https?://[a-zA-Z0-9._\-]+\.boosteroid[^\s"\'`<>]{0,60})',
                  r'BASE_URL["\'`\s]*[:=]+["\'`\s]*(https?://[^\s"\'`]{8,})',
                  r'baseUrl["\'`\s]*[:=]+["\'`\s]*(https?://[^\s"\'`]{8,})',
              ],
          }

          found = {k: {} for k in PATTERNS}
          exts = {".java", ".kt", ".xml", ".json", ".smali", ".properties", ".gradle"}

          for fpath in ROOT.rglob("*"):
              if not fpath.is_file(): continue
              if fpath.suffix.lower() not in exts: continue
              try:
                  content = fpath.read_text(errors="ignore")
              except Exception:
                  continue
              rel = str(fpath.relative_to(ROOT))
              for key, pats in PATTERNS.items():
                  for pat in pats:
                      for m in re.finditer(pat, content, re.IGNORECASE):
                          val = m.group(1).strip().strip('"\'`')
                          if len(val) < 4: continue
                          if val not in found[key]:
                              found[key][val] = []
                          if rel not in found[key][val]:
                              found[key][val].append(rel)

          lines = []
          lines.append("╔══════════════════════════════════════════════════╗")
          lines.append("║       Boosteroid Credential Extraction           ║")
          lines.append("╚══════════════════════════════════════════════════╝")
          lines.append("")

          any_found = False
          for key, vals in found.items():
              if not vals: continue
              any_found = True
              lines.append(f"── {key.upper().replace('_',' ')} " + "─"*(46-len(key)))
              for val, files in vals.items():
                  lines.append(f"  VALUE : {val}")
                  for f in files[:3]:
                      lines.append(f"  FILE  : {f}")
                  lines.append("")

          # BuildConfig files
          buildconfigs = list(ROOT.rglob("BuildConfig.java"))
          if buildconfigs:
              lines.append("── BUILDCONFIG.JAVA ────────────────────────────────")
              for bc in buildconfigs:
                  lines.append(f"\n  [{bc.relative_to(ROOT)}]")
                  lines.append(bc.read_text(errors="ignore"))

          if not any_found:
              lines.append("  ⚠️ No credentials matched — try manual search")
              lines.append("")
              lines.append("  💡 Check BuildConfig.java above for hardcoded values")

          OUT.write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines))

          clean_json = {}
          for key, vals in found.items():
              if vals:
                  clean_json[key] = list(vals.keys())
          JSON.write_text(json.dumps(clean_json, indent=2, ensure_ascii=False), encoding="utf-8")
          print(f"✅ Saved: {OUT}")
          print(f"✅ Saved: {JSON}")
          PYEOF

      - name: Upload credentials
        uses: actions/upload-artifact@v4
        with:
          name: boosteroid-credentials
          path: |
            credentials.txt
            credentials.json
          retention-days: 7

      - name: Summary
        run: |
          echo "### 🔑 Extracted Credentials" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat credentials.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

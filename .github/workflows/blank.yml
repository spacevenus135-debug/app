name: Build StopClock APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  BUILD_TOOLS_VERSION: '34.0.0'
  COMPILE_SDK: '34'

jobs:
  # ─────────────────────────────────────────────
  #  BUILD
  # ─────────────────────────────────────────────
  build:
    name: Build APK
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Unzip project if repo contains a zip ──────────────────────────────
      - name: Unzip project if needed
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP — extracting..."
            unzip -o "$ZIP" -d extracted/
            # move contents up if there's a single wrapper folder
            INNER=$(ls extracted/ | head -1)
            if [ $(ls extracted/ | wc -l) -eq 1 ] && [ -d "extracted/$INNER" ]; then
              cp -r extracted/$INNER/. .
            else
              cp -r extracted/. .
            fi
            echo "Extracted successfully"
          else
            echo "No zip found — assuming project is already at root"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-${{ env.COMPILE_SDK }}" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}"

      # gradlew missing from zip → generate it via wrapper task
      - name: Generate gradlew if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found — generating via gradle wrapper task"
            gradle wrapper \
              --gradle-version=8.4 \
              --distribution-type=bin
          fi
          chmod +x ./gradlew

      - name: Extract version
        id: version
        run: |
          VN=$(grep 'versionName' app/build.gradle | head -1 \
               | sed 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/')
          VC=$(grep 'versionCode' app/build.gradle | head -1 \
               | sed 's/.*versionCode[[:space:]]*\([0-9]*\).*/\1/')
          echo "version_name=${VN:-1.0}"  >> $GITHUB_OUTPUT
          echo "version_code=${VC:-1}"    >> $GITHUB_OUTPUT
          echo "Version: ${VN} (${VC})"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          VER="${{ steps.version.outputs.version_name }}"
          BLD="${{ github.run_number }}"
          D=app/build/outputs/apk/debug
          R=app/build/outputs/apk/release
          [ -f "$D/app-debug.apk" ] && \
            mv "$D/app-debug.apk" "$D/StopClock-${VER}-b${BLD}-debug.apk"
          [ -f "$R/app-release-unsigned.apk" ] && \
            mv "$R/app-release-unsigned.apk" "$R/StopClock-${VER}-b${BLD}-release-unsigned.apk"

      - name: APK info
        run: |
          echo "── Debug ──────────────────────"
          ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "not found"
          echo "── Release ────────────────────"
          ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null || echo "not found"

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopClock-debug-b${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: StopClock-release-unsigned-b${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  # ─────────────────────────────────────────────
  #  SIGN  (push to main/master only)
  #
  #  Secrets needed:
  #    KEYSTORE_BASE64    → base64 of your .jks file
  #    KEYSTORE_PASSWORD  → keystore password
  #    KEY_ALIAS          → key alias
  #    KEY_PASSWORD       → key password
  # ─────────────────────────────────────────────
  sign:
    name: Sign Release APK
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: StopClock-release-unsigned-b${{ github.run_number }}
          path: apk/

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: sdkmanager "build-tools;${{ env.BUILD_TOOLS_VERSION }}"

      - name: Decode keystore
        env:
          KB64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KB64" ]; then
            echo "::warning::KEYSTORE_BASE64 not set — skipping signing"
            echo "SKIP_SIGN=true" >> $GITHUB_ENV
          else
            echo "$KB64" | base64 --decode > stopclock.jks
            echo "SKIP_SIGN=false" >> $GITHUB_ENV
          fi

      - name: Sign & zipalign APK
        if: env.SKIP_SIGN == 'false'
        env:
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KK: ${{ secrets.KEY_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          VER="${{ needs.build.outputs.version_name }}"
          BLD="${{ github.run_number }}"
          UNSIGNED=$(ls apk/*.apk | head -1)
          SIGNED="apk/StopClock-${VER}-b${BLD}-signed.apk"
          ALIGNED="apk/StopClock-${VER}-b${BLD}-signed-aligned.apk"

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore stopclock.jks \
            -storepass "$KP" \
            -keypass   "$KK" \
            -signedjar "$SIGNED" \
            "$UNSIGNED" \
            "$KA"

          $ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS_VERSION }}/zipalign \
            -v 4 "$SIGNED" "$ALIGNED"

          $ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner \
            verify --verbose "$ALIGNED"

      - name: Upload signed APK
        if: env.SKIP_SIGN == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: StopClock-release-signed-b${{ github.run_number }}
          path: apk/*-signed-aligned.apk
          retention-days: 60

      - name: GitHub Release (on version tag)
        if: env.SKIP_SIGN == 'false' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "StopClock v${{ needs.build.outputs.version_name }}"
          body: |
            Build #${{ github.run_number }} — ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: apk/*-signed-aligned.apk

  # ─────────────────────────────────────────────
  #  SUMMARY
  # ─────────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [ build, sign ]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## StopClock Build Summary"
            echo "| | |"
            echo "|---|---|"
            echo "| Build | #${{ github.run_number }} |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| By | ${{ github.actor }} |"
            echo "| Build job | ${{ needs.build.result }} |"
            echo "| Sign job | ${{ needs.sign.result }} |"
          } >> $GITHUB_STEP_SUMMARY

name: Boosteroid APK Extract

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct APK download URL (optional)'
        required: false
        default: ''

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JADX
        run: |
          JADX_VER=$(curl -s https://api.github.com/repos/skylot/jadx/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4)
          curl -L "https://github.com/skylot/jadx/releases/download/${JADX_VER}/jadx-${JADX_VER#v}.zip" \
            -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          echo "$PWD/jadx/bin" >> $GITHUB_PATH

      - name: Download Boosteroid APK
        run: |
          APK_URL="${{ github.event.inputs.apk_url }}"
          if [ -z "$APK_URL" ]; then
            APK_URL=$(curl -sL "https://apkpure.com/boosteroid-cloud-gaming/com.boosteroid" \
              | grep -oP 'https://[^"]+\.apk' | head -1)
          fi
          curl -L "$APK_URL" -o boosteroid.apk

      - name: Decompile APK
        run: |
          jadx --threads-count 4 --output-dir decompiled boosteroid.apk

      # ── EXTRACT + SAVE CLEAN FILE ─────────────────────────────────────
      - name: Extract and save credentials
        run: |
          python3 << 'PYEOF'
          import os, re, json
          from pathlib import Path

          ROOT = Path("decompiled")
          OUT  = Path("credentials.txt")
          JSON = Path("credentials.json")

          # ── patterns to hunt ─────────────────────────────────────────
          PATTERNS = {
              "client_id": [
                  r'client[_-]?id["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-\.]{6,})',
                  r'clientId["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-\.]{6,})',
                  r'CLIENT_ID["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-\.]{6,})',
                  r'app[_-]?id["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-\.]{6,})',
              ],
              "client_secret": [
                  r'client[_-]?secret["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9+/=_\-]{8,})',
                  r'clientSecret["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9+/=_\-]{8,})',
                  r'CLIENT_SECRET["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9+/=_\-]{8,})',
                  r'app[_-]?secret["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9+/=_\-]{8,})',
              ],
              "api_key": [
                  r'api[_-]?key["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-]{10,})',
                  r'API_KEY["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-]{10,})',
                  r'apiKey["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_\-]{10,})',
              ],
              "oauth_token": [
                  r'Bearer\s+([A-Za-z0-9\._\-]{20,})',
                  r'access[_-]?token["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9\._\-]{20,})',
                  r'oauth[_-]?token["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9\._\-]{20,})',
              ],
              "base_url": [
                  r'(https?://[a-zA-Z0-9._\-]+\.boosteroid[^\s"\'`<>]{0,60})',
                  r'BASE_URL["\'`\s]*[:=]+["\'`\s]*(https?://[^\s"\'`]{8,})',
                  r'baseUrl["\'`\s]*[:=]+["\'`\s]*(https?://[^\s"\'`]{8,})',
              ],
              "grant_type": [
                  r'grant[_-]?type["\'`\s]*[:=]+["\'`\s]*([A-Za-z0-9_]{4,})',
              ],
          }

          # skip these junk values
          SKIP_VALUES = {
              "null","true","false","string","int","boolean",
              "object","array","example","test","none","",
          }

          found = {k: {} for k in PATTERNS}   # key → {value: [files]}

          exts = {".java",".kt",".xml",".json",".smali",".properties",".gradle"}

          for fpath in ROOT.rglob("*"):
              if not fpath.is_file(): continue
              if fpath.suffix.lower() not in exts: continue
              try:
                  content = fpath.read_text(errors="ignore")
              except Exception:
                  continue

              rel = str(fpath.relative_to(ROOT))

              for key, pats in PATTERNS.items():
                  for pat in pats:
                      for m in re.finditer(pat, content, re.IGNORECASE):
                          val = m.group(1).strip().strip('"\'`')
                          if val.lower() in SKIP_VALUES: continue
                          if len(val) < 4: continue
                          if val not in found[key]:
                              found[key][val] = []
                          if rel not in found[key][val]:
                              found[key][val].append(rel)

          # ── also grab full BuildConfig ───────────────────────────────
          buildconfigs = list(ROOT.rglob("BuildConfig.java"))

          # ── write clean credentials.txt ──────────────────────────────
          lines = []
          lines.append("╔══════════════════════════════════════════════════╗")
          lines.append("║       Boosteroid Credential Extraction           ║")
          lines.append("╚══════════════════════════════════════════════════╝")
          lines.append("")

          any_found = False
          for key, vals in found.items():
              if not vals: continue
              any_found = True
              lines.append(f"── {key.upper().replace('_',' ')} " + "─"*(46-len(key)))
              for val, files in vals.items():
                  lines.append(f"  VALUE : {val}")
                  for f in files[:3]:   # max 3 source files per value
                      lines.append(f"  FILE  : {f}")
                  lines.append("")

          if buildconfigs:
              lines.append("── BUILDCONFIG.JAVA ────────────────────────────────")
              for bc in buildconfigs:
                  lines.append(f"\n  [{bc.relative_to(ROOT)}]")
                  lines.append(bc.read_text(errors="ignore"))

          if not any_found:
              lines.append("  ⚠  No credentials matched — check deep_scan.txt")

          OUT.write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines))

          # ── write credentials.json (machine-readable) ────────────────
          clean_json = {}
          for key, vals in found.items():
              if vals:
                  # take unique values as list
                  clean_json[key] = list(vals.keys())

          JSON.write_text(
              json.dumps(clean_json, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print(f"\n✅ Saved: {OUT}  ({OUT.stat().st_size} bytes)")
          print(f"✅ Saved: {JSON}  ({JSON.stat().st_size} bytes)")
          PYEOF

      - name: Upload credentials
        uses: actions/upload-artifact@v4
        with:
          name: boosteroid-credentials
          path: |
            credentials.txt
            credentials.json
          retention-days: 7

      - name: Summary
        run: |
          echo "### 🔑 Extracted Credentials" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat credentials.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: List root files
        run: |
          echo "📁 Files in root:"
          ls -la

      - name: Unzip StopClock.zip
        run: |
          if [ -f "StopClock.zip" ]; then
            echo "📦 Extracting StopClock.zip..."
            unzip StopClock.zip
            echo "✅ Extraction complete!"
          else
            echo "❌ StopClock.zip not found in root!"
            echo "📁 Available files:"
            ls -la
            exit 1
          fi

      - name: List extracted files
        run: |
          echo "📁 After extraction:"
          ls -la
          echo ""
          echo "📁 Checking for stopclock folder:"
          ls -la stopclock/ 2>/dev/null || echo "❌ stopclock folder not found!"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: |
          if [ -f "stopclock/gradlew" ]; then
            chmod +x stopclock/gradlew
            echo "✅ Found gradlew in stopclock/"
          elif [ -f "StopClock/gradlew" ]; then
            chmod +x StopClock/gradlew
            echo "✅ Found gradlew in StopClock/"
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "✅ Found gradlew in root"
          else
            echo "❌ gradlew not found anywhere!"
            echo "📁 Searching for gradlew:"
            find . -name "gradlew" 2>/dev/null || echo "No gradlew found"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          if [ -d "stopclock" ]; then
            echo "📂 Building from stopclock folder..."
            cd stopclock
            ./gradlew assembleDebug
          elif [ -d "StopClock" ]; then
            echo "📂 Building from StopClock folder..."
            cd StopClock
            ./gradlew assembleDebug
          else
            echo "📂 Building from root..."
            ./gradlew assembleDebug
          fi

      - name: Find and Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: StopClock-debug
          path: |
            stopclock/app/build/outputs/apk/debug/*.apk
            StopClock/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk

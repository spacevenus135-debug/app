name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: List files (debug)
        run: ls -la

      - name: Unzip project
        run: |
          if [ -f "StopClock.zip" ]; then
            unzip StopClock.zip
            echo "✅ ZIP extracted successfully"
          else
            echo "❌ StopClock.zip not found!"
            exit 1
          fi

      - name: List after unzip (debug)
        run: ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: |
          if [ -f "StopClock/gradlew" ]; then
            chmod +x StopClock/gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "❌ gradlew not found!"
            ls -la
            exit 1
          fi

      - name: Build Debug APK
        run: |
          if [ -d "StopClock" ]; then
            cd StopClock && ./gradlew assembleDebug
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: StopClock-debug
          path: |
            StopClock/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
